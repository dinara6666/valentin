<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>
    <style>
        body {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            text-align: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .container {
            padding: 30px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            max-width: 90%;
        }
        h1 {
            color: #fff;
            font-size: 3.5em;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .heart {
            font-size: 70px;
            color: red;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            display: block;
            margin: 10px auto;
        }
        .btn:hover {
            background: #ff1a4d;
            transform: scale(1.1);
        }
        #message {
            font-size: 24px;
            color: #fff;
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .floating-hearts span {
            position: absolute;
            bottom: -10px;
            animation: floatUp 6s infinite ease-in-out;
            font-size: 50px;
            color: #ff4d6d;
        }
        @keyframes floatUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-100vh); opacity: 0; }
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.5em; }
            .btn { font-size: 18px; padding: 12px 25px; }
            #musicLink { margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts">
        <span style="left: 10%; animation-duration: 3s;">❤️</span>
        <span style="left: 30%; animation-duration: 4s;">💖</span>
        <span style="left: 50%; animation-duration: 5s;">💕</span>
        <span style="left: 70%; animation-duration: 3.5s;">❤️</span>
        <span style="left: 90%; animation-duration: 4.5s;">💞</span>
    </div>
    <div class="container">
        <h1>С Днём Святого Валентина! ❤️</h1>
        <div class="heart">💖</div>
        <p>Любовь - это волшебство, которое наполняет наши сердца светом и теплом. Подари улыбку и любовь тем, кто тебе дорог! 💕</p>
        <button class="btn" onclick="showMessage()">Нажми меня</button>
        <p id="message">if the world was ending, <br> i'd wanna be next to you💕</p>
        <a id="musicLink" class="btn" href="https://youtu.be/kPa7bsKwL-c?si=k94n42wJDD5n0MIN" target="_blank">Включить музыку 🎶</a>
    </div>
    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>
</body>
</html>
